<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111">
<title>Uma surpresa para você</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:#111;color:#fff}
main{width:100%;max-width:820px;text-align:center}
h1{font-size:clamp(22px,5vw,34px);margin:0 0 16px}
.video-wrap{overflow:hidden;border-radius:14px;background:#000;box-shadow:0 12px 36px #0008}
video{display:block;width:100%;max-height:78vh;object-fit:contain;background:#000}
button{margin-top:16px;padding:14px 22px;border:0;border-radius:999px;background:#ffcf33;color:#171717;font-size:16px;font-weight:700;cursor:pointer}
p{font-size:14px;line-height:1.45;color:#ddd;margin:13px 0 0}
</style>
</head>
<body>
<main>
<h1>Uma surpresa para você! 🎉</h1>
<div class="video-wrap">
<video id="video" autoplay muted playsinline loop preload="metadata" controls>
<source src="video.mp4" type="video/mp4">
Seu navegador não conseguiu reproduzir este vídeo.
</video>
</div>
<button id="soundButton" type="button">🔊 Ativar som</button>
<p>Se o vídeo não começar automaticamente, toque em reproduzir. Alguns celulares bloqueiam a reprodução automática com som.</p>
</main>
<script>
const video=document.getElementById('video');
const button=document.getElementById('soundButton');
video.play().catch(()=>{});
button.addEventListener('click',async()=>{
 video.muted=false; video.volume=1;
 try{await video.play();button.textContent='🔊 Som ativado';}
 catch(e){button.textContent='▶️ Toque no vídeo para reproduzir';}
});
</script>
</body>
</html>
